<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="PicklesToys — hand-finished toys, made in small batches. Not open yet.">
  <title>PicklesToys — Hand-Finished, Small-Batch Toys</title>

  <!--
    Social sharing card, 1200x630 (the size Facebook, LinkedIn, Slack, iMessage
    and X all crop from). This SVG is the source; site/og-image.png is rendered
    from it by tools/make_og_image.py. Edit here, then re-run that script.

    og:image will not accept SVG on most platforms, which is the only reason a
    PNG exists at all.

    The burst polygon and the doodle marks are the same shapes the page uses —
    both come from tools/make_pattern.py, so the card cannot drift away from
    the site's own vocabulary. Layout keeps every element inside a 72px margin,
    because several platforms crop this to 1.91:1 and some chat clients round
    the corners.
  -->

  <clipPath id="frame"><rect width="1200" height="630"/></clipPath>

  <g clip-path="url(#frame)">
    <rect width="1200" height="630" fill="#fbf3e4"/>

    <!-- Doodle field: the scribbled ground the title card sits on. -->
