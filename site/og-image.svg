<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="PicklesToys — handmade toys, made in small batches. Not open yet.">
  <title>PicklesToys — Handmade, Small-Batch Toys</title>

  <!--
    Social sharing card, 1200x630 (the size Facebook, LinkedIn, Slack, iMessage
    and X all crop from). This SVG is the source; site/og-image.png is rendered
    from it by tools/make_og_image.py. Edit here, then re-run that script.

    og:image will not accept SVG on most platforms, which is the only reason a
    PNG exists at all.

    Layout keeps every element inside a 72px margin, because several platforms
    crop this to 1.91:1 and some chat clients round the corners.

    Type is the system stack, matching styles.css. No webfont: the site is
    dependency-free by policy, and a card that renders differently on the
    machine that generates it is not worth the dependency anyway.
  -->

  <defs>
    <!-- Halftone: the era's printing artifact, same as the page background -->
    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1e1a17" fill-opacity="0.16"/>
    </pattern>

    <clipPath id="frame">
      <rect width="1200" height="630"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="630" fill="#fbf3e4"/>
    <rect width="1200" height="630" fill="url(#halftone)"/>

    <!-- Blobs, echoing the hero. Lumpy on both axes so they do not read as
         circles; ellipse plus rotation is the closest SVG equivalent of the
         CSS asymmetric border-radius used on the page. -->
    <g opacity="0.5" stroke="#1e1a17" stroke-width="3">
      <ellipse cx="1108" cy="86" rx="190" ry="168" fill="#f5c518" transform="rotate(-8 1108 86)"/>
      <ellipse cx="10" cy="664" rx="132" ry="144" fill="#0e6f6b" transform="rotate(12 10 664)"/>
      <ellipse cx="1150" cy="614" rx="86" ry="92" fill="#66399b" transform="rotate(-20 1150 614)"/>
    </g>

    <!-- Jar badge: the favicon mark, scaled from its 64x64 space to 116px -->
    <g transform="translate(72 62) scale(1.8125)">
      <rect width="64" height="64" rx="14" fill="#c8431b"/>
      <rect x="21" y="9" width="22" height="8" rx="3" fill="#fbf3e4"/>
      <path d="M16 20h32v27c0 5-4 9-9 9H25c-5 0-9-4-9-9V20z" fill="#fbf3e4"/>
      <ellipse cx="32" cy="37" rx="7" ry="12" fill="#5e8c1e" transform="rotate(-13 32 37)"/>
    </g>

    <text x="212" y="146"
          font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif"
          font-size="62" font-weight="800" letter-spacing="-2" fill="#1e1a17">Pickles<tspan fill="#c8431b">Toys</tspan></text>

    <!-- Headline. Two lines, because the third would push into the blob. -->
    <text x="72" y="330"
          font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif"
          font-size="86" font-weight="800" letter-spacing="-3" fill="#1e1a17">Handmade toys,</text>

    <!-- Brush stroke under the phrase that carries the meaning, drawn before
         the text so the ink sits on top of it. -->
    <path d="M402 415c161-9 412-11 573-5 10 0 14 4 13 11-1 7-7 11-18 10-159-5-408-3-566 5-10 1-15-3-15-10 0-6 4-10 13-11z" fill="#f5c518"/>
    <text x="72" y="430"
          font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif"
          font-size="86" font-weight="800" letter-spacing="-3" fill="#1e1a17">made in small batches.</text>

    <!-- Status pill. Slightly off-kilter, like the one on the page. -->
    <g transform="rotate(-1.2 72 520)">
      <rect x="76" y="500" width="566" height="66" rx="33" fill="#1e1a17"/>
      <rect x="72" y="496" width="566" height="66" rx="33" fill="#fffaf0" stroke="#1e1a17" stroke-width="3"/>
      <circle cx="116" cy="529" r="9" fill="#c8431b" stroke="#1e1a17" stroke-width="3"/>
      <text x="140" y="540"
            font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif"
            font-size="27" font-weight="700" fill="#1e1a17">Not open yet — still in the workshop</text>
    </g>

    <text x="1128" y="540" text-anchor="end"
          font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif"
          font-size="27" font-weight="700" fill="#a83714">picklestoys.com</text>
  </g>
</svg>
