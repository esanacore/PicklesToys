name: Deploy site to GitHub Pages

# Push-to-publish: every push to main redeploys the site from site/.
# This is the only deployment path — there is no separate hosting config.
#
# The test suite runs BEFORE the deploy step, so a broken push does not take
# the live site down: the previous deployment stays up if tests fail.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run site tests before publishing
        run: bash tests/test_site.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site directory as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
